[package]
name = "eos-output-example"
version = "0.1.0"
edition = "2024"
description = "Show how EOS tokens flow through DeepSeek Recipe output parsing."
publish = false

# Keep this example independent from the repository workspace.
[workspace]

[dependencies]
deepseek-recipe = { path = "../../deepseek-recipe" }
serde_json = "1.0"
tokenizers = "0.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
